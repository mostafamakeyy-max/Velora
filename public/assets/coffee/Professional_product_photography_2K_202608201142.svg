<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="prodBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2c1a11"/>
      <stop offset="50%" stop-color="#140e0a"/>
      <stop offset="100%" stop-color="#070504"/>
    </radialGradient>

    <!-- Kraft / Matte Foil Coffee Bag Gradient -->
    <linearGradient id="pouchMatte" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#241e1b"/>
      <stop offset="35%" stop-color="#181412"/>
      <stop offset="70%" stop-color="#0f0c0a"/>
      <stop offset="100%" stop-color="#211a17"/>
    </linearGradient>

    <!-- Gold Foil Label Texture -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5dc"/>
      <stop offset="25%" stop-color="#e6ca65"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="75%" stop-color="#997718"/>
      <stop offset="100%" stop-color="#fdf3cb"/>
    </linearGradient>

    <filter id="shadowProduct" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="35" flood-color="#000000" flood-opacity="0.95"/>
    </filter>

    <filter id="glowGold">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#prodBg)"/>

  <!-- Studio Rim Light Backing -->
  <ellipse cx="600" cy="380" rx="420" ry="250" fill="#d4af37" opacity="0.12" filter="url(#glowGold)"/>

  <!-- Dark Marble Textured Surface -->
  <polygon points="80,590 1120,590 1190,780 10,780" fill="#110d0a" stroke="#d4af37" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="10" y1="595" x2="1190" y2="595" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Floor Shadow for Coffee Bag -->
  <ellipse cx="600" cy="610" rx="180" ry="40" fill="#000000" opacity="0.9" filter="url(#shadowProduct)"/>

  <!-- ================= COMMERCIAL COFFEE POUCH / PACKAGING ================= -->
  <g filter="url(#shadowProduct)">
    <!-- Main Stand-Up Pouch Body -->
    <path d="M 450,220 L 750,220 L 780,580 C 780,600 420,600 420,580 Z" fill="url(#pouchMatte)" stroke="#d4af37" stroke-opacity="0.4" stroke-width="2"/>

    <!-- Heat-Sealed Top with Zipper Notch -->
    <path d="M 440,220 L 760,220 L 755,250 L 445,250 Z" fill="#17120f" stroke="#d4af37" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="465" cy="235" r="4" fill="#d4af37" opacity="0.8"/>
    <circle cx="735" cy="235" r="4" fill="#d4af37" opacity="0.8"/>

    <!-- Coffee Degassing Valve -->
    <circle cx="600" cy="285" r="14" fill="#15110e" stroke="#d4af37" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="600" cy="285" r="5" fill="#d4af37" opacity="0.8"/>
    <circle cx="594" cy="285" r="1.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="606" cy="285" r="1.5" fill="#ffffff" opacity="0.6"/>

    <!-- LUXURY GOLD EMBOSSED LABEL -->
    <rect x="475" y="325" width="250" height="215" rx="8" fill="#0c0907" stroke="url(#goldFoil)" stroke-width="2"/>
    <rect x="483" y="333" width="234" height="199" rx="5" fill="none" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1"/>

    <!-- Label Content: Mazaj Al Qahwa Brand -->
    <text x="600" y="375" fill="url(#goldFoil)" font-size="28" font-weight="900" text-anchor="middle" font-family="sans-serif">مزاج القهوة</text>
    <text x="600" y="398" fill="#e6ca65" font-size="10" font-weight="700" text-anchor="middle" font-family="sans-serif" letter-spacing="3">MAZAJ AL QAHWA</text>
    
    <line x1="520" y1="412" x2="680" y2="412" stroke="url(#goldFoil)" stroke-width="1.5"/>

    <!-- Origin & Roast Profile Badges -->
    <text x="600" y="435" fill="#fff5dc" font-size="12" font-weight="700" text-anchor="middle" font-family="sans-serif">إثيوبيا قوجي • مجففة</text>
    <text x="600" y="455" fill="#d4af37" font-size="10" font-weight="600" text-anchor="middle" font-family="sans-serif">ETHIOPIA GUJI • NATURAL</text>

    <!-- Notes: Jasmine, Bergamot, Blueberry -->
    <rect x="500" y="475" width="200" height="26" rx="13" fill="#d4af37" fill-opacity="0.15" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1"/>
    <text x="600" y="492" fill="#fff5dc" font-size="10" font-weight="600" text-anchor="middle" font-family="sans-serif">ياسمين • خوخ • عسل زهري</text>

    <!-- Net Weight -->
    <text x="600" y="522" fill="#a89278" font-size="9" font-family="monospace" text-anchor="middle" letter-spacing="1">NET WT. 250G // SPECIALTY GRADE</text>
  </g>

  <!-- ================= SCATTERED ROASTED BEANS FOREGROUND ================= -->
  <g fill="#2e180b" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1" filter="url(#shadowProduct)">
    <g transform="translate(350, 620) rotate(-15)"><ellipse cx="0" cy="0" rx="22" ry="15"/><path d="M -18,0 Q 0,4 18,0" stroke="#000" stroke-width="2.5" fill="none"/></g>
    <g transform="translate(410, 645) rotate(35)"><ellipse cx="0" cy="0" rx="20" ry="13"/><path d="M -16,0 Q 0,3 16,0" stroke="#000" stroke-width="2.5" fill="none"/></g>
    <g transform="translate(460, 615) rotate(-45)"><ellipse cx="0" cy="0" rx="19" ry="13"/><path d="M -15,0 Q 0,3 15,0" stroke="#000" stroke-width="2" fill="none"/></g>
    <g transform="translate(740, 625) rotate(25)"><ellipse cx="0" cy="0" rx="21" ry="14"/><path d="M -17,0 Q 0,4 17,0" stroke="#000" stroke-width="2.5" fill="none"/></g>
    <g transform="translate(790, 650) rotate(-30)"><ellipse cx="0" cy="0" rx="20" ry="13"/><path d="M -16,0 Q 0,3 16,0" stroke="#000" stroke-width="2" fill="none"/></g>
    <g transform="translate(850, 615) rotate(50)"><ellipse cx="0" cy="0" rx="18" ry="12"/><path d="M -14,0 Q 0,3 14,0" stroke="#000" stroke-width="2" fill="none"/></g>
    <!-- Scoop with coffee beans -->
    <ellipse cx="260" cy="620" rx="45" ry="18" fill="#1a1614" stroke="#d4af37" stroke-width="1.5"/>
    <circle cx="250" cy="618" r="8" fill="#2e180b"/>
    <circle cx="265" cy="616" r="7" fill="#2e180b"/>
    <circle cx="280" cy="619" r="8" fill="#2e180b"/>
  </g>

  <!-- Typography & Watermark -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Top Left File Tag -->
    <rect x="50" y="50" width="340" height="34" rx="17" fill="#050507" fill-opacity="0.85" stroke="#d4af37" stroke-width="1.5"/>
    <circle cx="70" cy="67" r="5" fill="#d4af37"/>
    <text x="86" y="72" fill="#fff8dc" font-size="12" font-weight="700" letter-spacing="0.5">Professional_product_photography</text>

    <!-- Top Right Session Badge -->
    <text x="1150" y="72" fill="#d4af37" font-size="14" font-weight="800" text-anchor="end" letter-spacing="2">MAZAJ AL QAHWA // 2K PRODUCT</text>

    <!-- Bottom Caption -->
    <text x="50" y="730" fill="#ffffff" font-size="20" font-weight="800">جلسة تصوير مزاج القهوة</text>
    <text x="50" y="755" fill="#d4af37" font-size="13" font-weight="600" letter-spacing="0.5">2K Commercial Packaging & Specialty Coffee Beans Showcase</text>
  </g>
</svg>
