<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="v60bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#241710"/>
      <stop offset="50%" stop-color="#120c08"/>
      <stop offset="100%" stop-color="#060504"/>
    </radialGradient>

    <!-- Golden Amber Stream Gradient -->
    <linearGradient id="coffeeStream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e6ca65"/>
      <stop offset="40%" stop-color="#c97d26"/>
      <stop offset="80%" stop-color="#693009"/>
      <stop offset="100%" stop-color="#3d1805"/>
    </linearGradient>

    <!-- Glass Carafe Gradient -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="70%" stop-color="#d4af37" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Liquid in Carafe -->
    <linearGradient id="brewedCoffee" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a4b16"/>
      <stop offset="100%" stop-color="#2c1407"/>
    </linearGradient>

    <filter id="glowv60">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadowv60" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="800" fill="url(#v60bg)"/>

  <!-- Warm Atmospheric Light -->
  <circle cx="600" cy="380" r="350" fill="#d4af37" opacity="0.08" filter="url(#glowv60)"/>

  <!-- Wooden Pour-Over Stand / Countertop -->
  <path d="M 150,650 L 1050,650 L 1120,780 L 80,780 Z" fill="#140f0c" stroke="#d4af37" stroke-opacity="0.2" stroke-width="2"/>
  <line x1="80" y1="655" x2="1120" y2="655" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Shadow below Server -->
  <ellipse cx="600" cy="645" rx="140" ry="35" fill="#000000" opacity="0.85"/>

  <!-- Glass Server (Carafe) -->
  <g filter="url(#shadowv60)">
    <!-- Liquid Body Inside Carafe -->
    <path d="M 530,530 C 510,580 500,610 500,630 C 500,645 540,650 600,650 C 660,650 700,645 700,630 C 700,610 690,580 670,530 Z" fill="url(#brewedCoffee)"/>

    <!-- Carafe Glass Walls -->
    <path d="M 560,450 L 530,530 C 505,585 495,615 495,632 C 495,650 540,658 600,658 C 660,658 705,650 705,632 C 705,615 695,585 670,530 L 640,450 Z" 
          fill="url(#glassReflection)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Carafe Handle -->
    <path d="M 700,520 C 760,520 770,610 700,620" fill="none" stroke="#2a2420" stroke-width="16" stroke-linecap="round"/>
    <path d="M 700,520 C 760,520 770,610 700,620" fill="none" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Measurement Markings (50ml, 100ml, 150ml) -->
    <g stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5">
      <line x1="525" y1="560" x2="540" y2="560"/>
      <line x1="520" y1="590" x2="540" y2="590"/>
      <line x1="515" y1="620" x2="540" y2="620"/>
    </g>
  </g>

  <!-- Ceramic V60 Dripper (Top Cone) -->
  <g filter="url(#shadowv60)">
    <!-- Base collar of dripper -->
    <ellipse cx="600" cy="455" rx="75" ry="18" fill="#1b1715" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- V60 Cone Funnel -->
    <path d="M 470,290 L 565,450 L 635,450 L 730,290 Z" fill="#201b18" stroke="#d4af37" stroke-opacity="0.5" stroke-width="2"/>

    <!-- Dripper Rim -->
    <ellipse cx="600" cy="290" rx="130" ry="38" fill="#2b2521" stroke="#d4af37" stroke-opacity="0.6" stroke-width="2"/>

    <!-- Fluted Filter Paper (Cone interior) -->
    <ellipse cx="600" cy="294" rx="116" ry="32" fill="#d9c3a3"/>
    
    <!-- Bed of Fresh Ground Coffee (Blooming) -->
    <ellipse cx="600" cy="302" rx="90" ry="22" fill="#29160a"/>
    <ellipse cx="600" cy="301" rx="70" ry="15" fill="#3d200e" filter="url(#glowv60)"/>
    
    <!-- Golden Water Spiral Drop on Coffee Bed -->
    <circle cx="600" cy="301" r="14" fill="#e6ca65" opacity="0.6" filter="url(#glowv60)"/>
  </g>

  <!-- Precision Gooseneck Kettle Spout (Top Left) -->
  <path d="M 280,140 C 350,150 480,180 575,230" fill="none" stroke="#2b2825" stroke-width="22" stroke-linecap="round"/>
  <path d="M 280,140 C 350,150 480,180 575,230" fill="none" stroke="#d4af37" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>

  <!-- Hot Water Stream pouring from kettle into coffee bed -->
  <path d="M 575,230 Q 590,265 600,295" fill="none" stroke="#e0f2fe" stroke-opacity="0.75" stroke-width="3.5" stroke-linecap="round" filter="url(#glowv60)"/>

  <!-- Rich Amber Coffee Stream Dripping into Carafe -->
  <path d="M 600,455 L 600,535" stroke="url(#coffeeStream)" stroke-width="5" stroke-linecap="round" filter="url(#glowv60)"/>
  <ellipse cx="600" cy="535" rx="8" ry="4" fill="#f5dfa2" opacity="0.8"/>

  <!-- Delicate Artisan Steam -->
  <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#glowv60)">
    <path d="M 570,260 Q 540,210 565,160 T 550,90"/>
    <path d="M 625,250 Q 650,200 620,150 T 640,80"/>
  </g>

  <!-- Metadata & Typography -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Top Left File Tag -->
    <rect x="50" y="50" width="160" height="34" rx="17" fill="#050507" fill-opacity="0.8" stroke="#d4af37" stroke-width="1.5"/>
    <circle cx="70" cy="67" r="5" fill="#d4af37"/>
    <text x="86" y="72" fill="#fff8dc" font-size="13" font-weight="700" letter-spacing="1">IMG_9558.JPG</text>

    <!-- Top Right Session Badge -->
    <text x="1150" y="72" fill="#d4af37" font-size="14" font-weight="800" text-anchor="end" letter-spacing="2">MAZAJ AL QAHWA // V60</text>

    <!-- Bottom Caption -->
    <text x="50" y="730" fill="#ffffff" font-size="20" font-weight="800">جلسة تصوير مزاج القهوة</text>
    <text x="50" y="755" fill="#d4af37" font-size="13" font-weight="600" letter-spacing="0.5">Artisan V60 Pour-Over Session • Specialty Drip Extraction</text>
  </g>
</svg>
