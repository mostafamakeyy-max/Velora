<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="60%" stop-color="#120c08"/>
      <stop offset="100%" stop-color="#070504"/>
    </radialGradient>

    <!-- Warm Amber Spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#e6ca65" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#120c08" stop-opacity="0"/>
    </radialGradient>

    <!-- Cup Ceramic Gradient -->
    <linearGradient id="cupCeramic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2825"/>
      <stop offset="50%" stop-color="#181615"/>
      <stop offset="100%" stop-color="#0d0c0b"/>
    </linearGradient>

    <!-- Rich Espresso & Golden Crema Gradient -->
    <radialGradient id="cremaGold" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f5dfa2"/>
      <stop offset="35%" stop-color="#d99f43"/>
      <stop offset="70%" stop-color="#8a4b16"/>
      <stop offset="100%" stop-color="#3d1d07"/>
    </radialGradient>

    <!-- Saucer Gradient -->
    <linearGradient id="saucerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#332f2b"/>
      <stop offset="70%" stop-color="#1a1816"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="url(#bgGlow)"/>

  <!-- Subtle Studio Texture Lines -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
  </g>

  <!-- Dramatic Atmospheric Warm Glow -->
  <ellipse cx="600" cy="420" rx="420" ry="260" fill="url(#spotlight)"/>

  <!-- Table Surface Shadow -->
  <ellipse cx="600" cy="580" rx="360" ry="80" fill="#000000" opacity="0.8" filter="url(#shadow)"/>

  <!-- Ceramic Saucer -->
  <g filter="url(#shadow)">
    <ellipse cx="600" cy="540" rx="260" ry="75" fill="url(#saucerGrad)" stroke="#d4af37" stroke-opacity="0.3" stroke-width="2"/>
    <ellipse cx="600" cy="535" rx="245" ry="68" fill="#151312" stroke="#d4af37" stroke-opacity="0.15" stroke-width="1"/>
    <ellipse cx="600" cy="528" rx="160" ry="42" fill="#0c0a09"/>
  </g>

  <!-- Ceramic Coffee Cup Body -->
  <g filter="url(#shadow)">
    <!-- Cup Exterior -->
    <path d="M 440,380 C 440,510 470,520 600,520 C 730,520 760,510 760,380 Z" fill="url(#cupCeramic)" stroke="#d4af37" stroke-opacity="0.4" stroke-width="2.5"/>
    
    <!-- Cup Handle -->
    <path d="M 750,400 C 820,400 835,470 745,480" fill="none" stroke="url(#cupCeramic)" stroke-width="26" stroke-linecap="round"/>
    <path d="M 750,400 C 820,400 835,470 745,480" fill="none" stroke="#d4af37" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>

    <!-- Cup Rim & Interior -->
    <ellipse cx="600" cy="380" rx="160" ry="58" fill="#1c1917" stroke="#d4af37" stroke-opacity="0.5" stroke-width="2"/>

    <!-- Golden Espresso Liquid Surface with Crema -->
    <ellipse cx="600" cy="386" rx="146" ry="50" fill="url(#cremaGold)"/>

    <!-- Delicate Microfoam Crema Swirls -->
    <path d="M 540,385 C 570,370 630,370 660,385 C 630,395 570,395 540,385 Z" fill="#fff5dc" opacity="0.85" filter="url(#glow)"/>
    <path d="M 565,386 C 585,378 615,378 635,386 C 615,391 585,391 565,386 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="530" cy="382" r="3" fill="#ffffff" opacity="0.7"/>
    <circle cx="670" cy="388" r="2.5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Steam Ribbons -->
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M 570,350 Q 550,290 580,240 T 565,170"/>
    <path d="M 610,340 Q 635,280 605,230 T 625,150"/>
    <path d="M 650,355 Q 670,300 645,250 T 665,180"/>
  </g>

  <!-- Scattered Roasted Coffee Beans on Counter -->
  <g fill="#2d170a" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1" filter="url(#shadow)">
    <!-- Bean 1 -->
    <g transform="translate(360, 560) rotate(-25)">
      <ellipse cx="0" cy="0" rx="20" ry="13"/>
      <path d="M -16,0 Q 0,4 16,0" stroke="#000000" stroke-width="2.5" fill="none"/>
    </g>
    <!-- Bean 2 -->
    <g transform="translate(410, 595) rotate(40)">
      <ellipse cx="0" cy="0" rx="18" ry="12"/>
      <path d="M -14,0 Q 0,3 14,0" stroke="#000000" stroke-width="2" fill="none"/>
    </g>
    <!-- Bean 3 -->
    <g transform="translate(820, 550) rotate(15)">
      <ellipse cx="0" cy="0" rx="21" ry="14"/>
      <path d="M -17,0 Q 0,4 17,0" stroke="#000000" stroke-width="2.5" fill="none"/>
    </g>
    <!-- Bean 4 -->
    <g transform="translate(780, 590) rotate(-55)">
      <ellipse cx="0" cy="0" rx="17" ry="11"/>
      <path d="M -13,0 Q 0,3 13,0" stroke="#000000" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- Elegant Editorial Watermark & Metadata -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Top Left Badge -->
    <rect x="50" y="50" width="160" height="34" rx="17" fill="#050507" fill-opacity="0.8" stroke="#d4af37" stroke-width="1.5"/>
    <circle cx="70" cy="67" r="5" fill="#d4af37"/>
    <text x="86" y="72" fill="#fff8dc" font-size="13" font-weight="700" letter-spacing="1">IMG_9546.JPG</text>

    <!-- Top Right Brand Stamp -->
    <text x="1150" y="72" fill="#d4af37" font-size="14" font-weight="800" text-anchor="end" letter-spacing="2">MAZAJ AL QAHWA // 4K</text>

    <!-- Bottom Left Session Caption -->
    <text x="50" y="730" fill="#ffffff" font-size="20" font-weight="800">جلسة تصوير مزاج القهوة</text>
    <text x="50" y="755" fill="#d4af37" font-size="13" font-weight="600" letter-spacing="0.5">Signature Specialty Espresso • Golden Crema Master</text>
  </g>
</svg>
